[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-hunt"
version = "0.1.0"
description = "Backdoor-detection experiments (activation, output-surprise, judge and neuron monitors) and a static weight-diff triage tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The defection-probe research pipeline under src/ (model organisms, activation
# collection, probes, elicitation). The base deps cover the ghosthunt triage tool only.
research = [
    # transformers >=5.8 is REQUIRED for Qwen3.8-27B: the checkpoint's config declares
    # transformers_version 5.8.0.dev0, and 4.57.x has no Qwen3_5ForConditionalGeneration
    # at all, so the loader cannot construct it. Verified working combination against
    # the pinned checkpoint (revision 1d4bf0f2ff60...) on 2x H200:
    #   torch 2.8.0.dev20250319+cu128, transformers 5.16.1, peft 0.20.0,
    #   accelerate 1.14.0, CUDA 12.8, driver 580.178.04, Python 3.11.11
    "transformers>=5.8",
    # src/data/price_sleeper.py rebuilds the transformers-4.40 token ids Price et al.'s
    # Llama-2 sleeper was trained on; 5.x tokenizes text next to its added special
    # tokens differently, so the segments go through sentencepiece directly.
    "sentencepiece>=0.2",
    "accelerate>=1.0",
    "peft>=0.11",
    # only a QLoRA fallback path; bf16 LoRA is the primary condition and the 27B
    # feasibility run did not need it
    "bitsandbytes>=0.43",
    "datasets>=2.19",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pytest>=8.0",
]

# Established capability evals (scripts/run_tiny_benchmarks.py, scripts/export_tiny_benchmarks.py):
# lm-evaluation-harness for the tinyBenchmarks task group + the tinyBenchmarks package
# holding the IRT weights that turn 100-item accuracy into a full-benchmark estimate.
evals = [
    "lm-eval>=0.4.13",
    "tinyBenchmarks @ git+https://github.com/felipemaiapolo/tinyBenchmarks",
    # similarity-to-normal-answer metric in scripts/analyse_price_sweep.py (runs on CPU)
    "sentence-transformers>=3.0",
]

[project.scripts]
ghost-hunt = "ghosthunt.cli:main"

[tool.setuptools.packages.find]
include = ["ghosthunt*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
