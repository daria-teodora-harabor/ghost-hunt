- python -m src.evaluation.score_experiment --config ~/phase1_store/generated/qual_pinned.yaml
  --stage pilot --artifact ~/phase1_store/qual_pilot.jsonl --emit-next ~/phase1_store/generated/qual_screen.yaml
- python -m src.evaluation.organism_quality --config ~/phase1_store/generated/qual_screen.yaml
