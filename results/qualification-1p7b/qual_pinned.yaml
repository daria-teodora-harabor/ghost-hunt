carrier_pools: three_way
notes: 'Qualification passes iff: (1) the teacher dataset builds and its hash is stable
  across two builds; (2) every stage dry-runs clean and then runs to the declared
  row count; (3) each stage''s rows carry that stage''s seeds and no other''s; (4)
  the pilot verdict names one recipe mechanically; (5) the screen verdict emits a
  confirmation config whose families are exactly the admitted sparse set, with no
  cross-pairs; (6) the confirmation scores with a fail-closed manifest and produces
  a verdict. The population verdict itself is expected to be REJECTED at 1.7B (a 3-behaviour
  screen cannot reach min_families 12); that is the correct outcome and is not a failure
  of the pipeline.

  '
launch_sequence:
- python -m src.data.teacher build --base Qwen/Qwen3-1.7B --out ~/phase1_store/teacher
